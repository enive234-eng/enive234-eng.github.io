<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Sign In | ENIVÈ Admin</title>
    <meta name="robots" content="noindex,nofollow" />
    <link rel="stylesheet" href="/css/admin.css" />
    <script type="module" src="/js/admin/login.js"></script>
  </head>
  <body class="login-page">
    <main class="login-card">
      <a class="admin-brand" href="/">ENIVÈ</a>
      <p class="kicker">Website administration</p>
      <h1>Welcome back.</h1>
      <form id="login-form">
        <label
          >Email<input
            type="email"
            name="email"
            required
            autocomplete="username" /></label
        ><label
          >Password<input
            type="password"
            name="password"
            required
            autocomplete="current-password" /></label
        ><button type="submit">Sign in</button>
        <p role="status" aria-live="polite"></p>
      </form>
      <a id="forgot-password" class="back-link" href="#">Forgot password?</a
      ><a class="back-link" href="/">← Back to website</a>
    </main>
  </body>
</html>
